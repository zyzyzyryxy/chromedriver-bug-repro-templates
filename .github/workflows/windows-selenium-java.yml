name: Windows Selenium Java

on:
  push:
    paths:
      - 'selenium-java/**'
      - '.github/workflows/windows-selenium-java.yml'
  pull_request:
    paths:
      - 'selenium-java/**'
      - '.github/workflows/windows-selenium-java.yml'

defaults:
  run:
    working-directory: selenium-java

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Mock ADB
      run: |
        New-Item -ItemType Directory -Force -Path "mock-adb"
        $adbPath = "mock-adb\adb.bat"
        $scriptContent = @"
        @echo off
        set args=%*
        
        if "%1"=="devices" (
            echo List of devices attached
            echo emulator-5554	device
            exit /b 0
        )
        
        if "%1"=="start-server" (
            exit /b 0
        )
        
        echo %args% | findstr /C:"version" >nul
        if %errorlevel%==0 (
            echo Android Debug Bridge version 1.0.41
            exit /b 0
        )
        
        echo %args% | findstr /C:"ro.build.version.release" >nul
        if %errorlevel%==0 (
            echo 11
            exit /b 0
        )
        
        echo %args% | findstr /C:"ro.build.version.sdk" >nul
        if %errorlevel%==0 (
            echo 30
            exit /b 0
        )

        echo %args% | findstr /C:"sys.boot_completed" >nul
        if %errorlevel%==0 (
            echo 1
            exit /b 0
        )
        
        echo %args% | findstr /C:"pm list packages" >nul
        if %errorlevel%==0 (
            echo package:com.android.chrome
            exit /b 0
        )
        
        echo %args% | findstr /C:"dumpsys package" >nul
        if %errorlevel%==0 (
            echo versionName=91.0.4472.101
            exit /b 0
        )
        
        echo %args% | findstr /C:"forward" >nul
        if %errorlevel%==0 (
            echo 5555
            exit /b 0
        )
        
        rem Default success for other commands (push, shell am start, etc.)
        exit /b 0
        "@
        
        Set-Content -Path $adbPath -Value $scriptContent
        
        # Add mock-adb to PATH
        echo "$PWD\mock-adb" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
        # Verify it works
        & "mock-adb\adb.bat" devices
      shell: powershell

    - name: Run test
      working-directory: selenium-java
      run: mvn test
      env:
        # Ensure we use the mock, though PATH should handle it.
        # Sometimes tools look for ANDROID_HOME.
        ANDROID_HOME: ${{ github.workspace }}\mock-android-home

    - name: Run tests
      run: mvn test

    - name: Dump log
      if: always()
      run: cat chromedriver.log
