name: Windows Selenium Java

on:
  push:
    paths:
      - 'selenium-java/**'
      - '.github/workflows/windows-selenium-java.yml'
  pull_request:
    paths:
      - 'selenium-java/**'
      - '.github/workflows/windows-selenium-java.yml'

defaults:
  run:
    working-directory: selenium-java

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android System Image
      run: sdkmanager "system-images;android-25;google_apis;x86" "platform-tools" "platforms;android-25"

    - name: Create AVD
      run: echo "no" | avdmanager create avd -n test -k "system-images;android-25;google_apis;x86" --force

    - name: Start Emulator
      working-directory: ${{ env.ANDROID_HOME }}/emulator
      run: |
        echo "Starting emulator..."
        $p = Start-Process -FilePath .\emulator.exe -ArgumentList "-avd test -verbose -no-window -gpu off -no-audio -no-boot-anim -no-snapshot" -PassThru -RedirectStandardOutput "emulator.log" -RedirectStandardError "emulator_err.log"
        echo "Emulator process started with ID: $($p.Id)"
      shell: powershell

    - name: Wait for Emulator
      run: |
        $path = "$env:ANDROID_HOME/platform-tools/adb.exe"
        echo "Waiting for device to appear on ADB..."
        
        $timeout = 300
        $timer = [System.Diagnostics.Stopwatch]::StartNew()
        $deviceConnected = $false

        while ($timer.Elapsed.TotalSeconds -lt $timeout) {
            $devices = & $path devices
            if ($devices -match "emulator-5554\s+device") {
                echo "Device connected!"
                $deviceConnected = $true
                break
            }
            if ($devices -match "emulator-5554\s+offline") {
                echo "Device is offline, waiting..."
            }
            
            # Check if emulator process is still alive
            $emulatorProcess = Get-Process -Name "emulator" -ErrorAction SilentlyContinue
            if (-not $emulatorProcess) {
                echo "Emulator process has died!"
                break
            }

            Start-Sleep -Seconds 5
        }

        if (-not $deviceConnected) {
            echo "Emulator failed to connect within timeout or process died."
            echo "--- Emulator Stdout ---"
            if (Test-Path "${{ env.ANDROID_HOME }}/emulator/emulator.log") {
                Get-Content "${{ env.ANDROID_HOME }}/emulator/emulator.log" | Select-Object -Last 100
            }
            echo "--- Emulator Stderr ---"
             if (Test-Path "${{ env.ANDROID_HOME }}/emulator/emulator_err.log") {
                Get-Content "${{ env.ANDROID_HOME }}/emulator/emulator_err.log" | Select-Object -Last 100
            }
            exit 1
        }

        echo "Waiting for boot completion..."
        $boot_completed = $false
        $timer = [System.Diagnostics.Stopwatch]::StartNew()
        while ($timer.Elapsed.TotalSeconds -lt $timeout) {
            $status = & $path shell getprop sys.boot_completed
            if ($status -and $status.Trim() -eq "1") { 
                $boot_completed = $true
                echo "Boot completed!"
                break 
            }
            echo "Boot status: $status. Waiting..."
            Start-Sleep -Seconds 10
        }
        
        if (-not $boot_completed) {
            echo "Emulator failed to boot within timeout."
            exit 1
        }
      shell: powershell

    - name: Run tests
      run: mvn test

    - name: Dump log
      if: always()
      run: cat chromedriver.log
